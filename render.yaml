services:
  - type: web
    name: milk-factory-backend
    env: python
    pythonVersion: 3.12
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python seed.py && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    automaticDeploy: true
